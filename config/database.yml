default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: localhost
  port: 5432
  username: ${POSTGRES_USER}
  password: ${POSTGRES_PASSWORD}

development:
  <<: *default
  database: ${POSTGRES_DB_DEV}

test:
  <<: *default
  database: ${POSTGRES_DB_TEST}

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>