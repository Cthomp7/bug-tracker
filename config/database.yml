default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: localhost
  port: 5432
  username: <%= ENV.fetch("POSTGRES_USER") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD") %>

development:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB_DEV") %>

test:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB_TEST") %>

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>